<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Manager</title>

        <!--Fonts-->
        <link rel="stylesheet" href="fonts/Arimo/Arimo.css">
        <link rel="stylesheet" href="fonts/Inter/Inter.css">
        <link rel="stylesheet" href="fonts/Roboto/Roboto.css">
        
        <!--Main CSS file-->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <button type="button" id="skipLink">Skip to add product form</button>
        <button type="button" id="shortcuts" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">⌨️ Shortcuts</button>
        <button type="button" id="toggle" class="toggle" aria-pressed="false">Dark Mode</button>

        <main id="app">
            <header>
                <h1>Product Manager</h1>
                <p id="subtitle">Save and manage your products using the web browser local storage</p>
            </header>
            
            <form id="form" novalidate>
                <div id="input">
                    <input type="text" id="productName" placeholder="Product Name" aria-label="Product Name" maxlength="60" enterkeyhint="next" required>
                    <input type="number" inputmode="decimal" id="productPrice" placeholder="Product Price" aria-label="Product Price" min="0" step="0.01" enterkeyhint="next" required>
                    <input type="number" inputmode="numeric" id="productQuantity" placeholder="Product Quantity" aria-label="Product Quantity" min="0" step="1" enterkeyhint="done" required>
                </div>

                <div id="messages">
                    <button type="submit" id="saveBtn" aria-label="Save Product">Save Product</button>
                    <div id="validation" role="alert" aria-live="polite"></div>
                </div>

                <p id="message" role="status" aria-live="polite"></p>
            </form>

            <div class="productBox">
                <h2>Products:</h2>
                <div id="productList"></div>
            </div>
        </main>

        <div id="shortcutsModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalTitle">
            <div id="modalContent">
                <button type="button" id="closeModal" aria-label="Close shortcuts">
                    &times;
                </button>

                <h2 id="modalTitle">⌨️ Keyboard Shortcuts</h2>

                <table>
                    <thead>
                        <tr><th>Shortcut</th><th>Action</th></tr>
                    </thead>
                
                    <tbody>
                        <tr>
                            <td><kbd>/</kbd> or <kbd>Alt</kbd> + <kbd>R</kbd></td><td>Focus product form</td>
                        </tr>

                        <tr>
                            <td><kbd>Alt</kbd> + <kbd>D</kbd></td><td>Toggle Dark Mode</td>
                        </tr>

                        <tr>
                            <td><kbd>Escape</kbd></td><td>Cancel Editing</td>
                        </tr>

                        <tr>
                            <td><kbd>?</kbd></td><td>Open this help</td>
                        </tr>
                    </tbody>
                </table>

                <p id="modalFooter">Press <kbd>Escape</kbd> or click outside to close.</p>
            </div>
        </div>

        <footer>
            <p id="footer">Press <kbd>?</kbd> to see the shortcuts.</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
